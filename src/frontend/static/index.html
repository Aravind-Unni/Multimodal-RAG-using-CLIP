<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multimodal RAG</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: #12151c;
    --surface-2: #171b24;
    --border: #232833;
    --text: #e6e8ec;
    --text-dim: #8b93a3;
    --accent: #6d8bff;
    --accent-dim: #3a4a8f;
    --accent-text: #cdd8ff;
    --image-accent: #ffb454;
    --radius: 10px;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(circle at 20% 0%, #141826 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  header {
    margin-bottom: 40px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-text);
    background: rgba(109, 139, 255, 0.12);
    border: 1px solid rgba(109, 139, 255, 0.25);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 28px;
    font-weight: 650;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 14.5px;
    margin: 0;
  }

  .query-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
    display: flex;
    gap: 8px;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.02) inset;
  }

  #question {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    padding: 12px 14px;
    font-family: inherit;
  }

  #question::placeholder { color: var(--text-dim); }

  #ask-btn {
    background: var(--accent);
    color: #0b0d12;
    border: none;
    border-radius: 7px;
    padding: 0 22px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #ask-btn:hover { opacity: 0.9; }
  #ask-btn:active { transform: scale(0.98); }
  #ask-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(11, 13, 18, 0.3);
    border-top-color: #0b0d12;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  .spinner.active { display: inline-block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  section { margin-top: 36px; }

  .section-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .answer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--text);
  }

  .answer-card.empty {
    color: var(--text-dim);
    font-style: italic;
  }

  .answer-card code {
    background: rgba(109, 139, 255, 0.12);
    color: var(--accent-text);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.92em;
  }

  .sources-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .source-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .source-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s ease;
  }

  .source-header:hover { background: var(--surface-2); }

  .type-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .type-dot.text { background: var(--accent); }
  .type-dot.image { background: var(--image-accent); }

  .source-title {
    font-size: 13.5px;
    font-weight: 500;
    flex: 1;
  }

  .source-type-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 999px;
  }

  .chevron {
    color: var(--text-dim);
    transition: transform 0.15s ease;
    font-size: 12px;
  }

  .source-card.open .chevron { transform: rotate(90deg); }

  .source-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-dim);
  }

  .source-card.open .source-body { display: block; padding-top: 14px; }

  .source-body img {
    max-width: 100%;
    border-radius: 8px;
    margin-top: 8px;
    border: 1px solid var(--border);
  }

  .empty-state {
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 24px 0;
  }

  .error-banner {
    background: rgba(255, 90, 90, 0.1);
    border: 1px solid rgba(255, 90, 90, 0.3);
    color: #ff9a9a;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    margin-top: 16px;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">CLIP · Qdrant · Hybrid Search</div>
    <h1>Multimodal Document Q&amp;A</h1>
    <p class="subtitle">Ask questions grounded in the document's text and charts.</p>
  </header>

  <div class="query-card">
    <input type="text" id="question" placeholder="e.g. What was the Q3 revenue comparison?" autocomplete="off" />
    <button id="ask-btn" onclick="ask()">
      <span class="spinner" id="spinner"></span>
      <span id="ask-label">Ask</span>
    </button>
  </div>

  <div id="error-container"></div>

  <section>
    <div class="section-label">Answer</div>
    <div class="answer-card empty" id="answer">Ask a question to see the answer here.</div>
  </section>

  <section>
    <div class="section-label" id="sources-heading">Retrieved sources</div>
    <div class="sources-list" id="sources">
      <div class="empty-state">No sources retrieved yet.</div>
    </div>
  </section>
</div>

<script>
  const questionInput = document.getElementById("question");
  const askBtn = document.getElementById("ask-btn");
  const askLabel = document.getElementById("ask-label");
  const spinner = document.getElementById("spinner");
  const answerEl = document.getElementById("answer");
  const sourcesEl = document.getElementById("sources");
  const sourcesHeading = document.getElementById("sources-heading");
  const errorContainer = document.getElementById("error-container");

  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") ask();
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function toggleSource(card) {
    card.classList.toggle("open");
  }

  async function ask() {
    const question = questionInput.value.trim();
    if (!question) return;

    setLoading(true);
    errorContainer.innerHTML = "";

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });

      if (!response.ok) {
        throw new Error(`Request failed (${response.status})`);
      }

      const data = await response.json();
      renderAnswer(data.answer);
      renderSources(data.sources);
    } catch (err) {
      errorContainer.innerHTML = `<div class="error-banner">Something went wrong: ${escapeHtml(err.message)}</div>`;
    } finally {
      setLoading(false);
    }
  }

  function setLoading(isLoading) {
    askBtn.disabled = isLoading;
    spinner.classList.toggle("active", isLoading);
    askLabel.textContent = isLoading ? "Thinking..." : "Ask";
  }

  function renderAnswer(text) {
    answerEl.classList.remove("empty");
    answerEl.textContent = text;
  }

  function renderSources(sources) {
    sourcesHeading.textContent = `Retrieved sources (${sources.length})`;
    sourcesEl.innerHTML = "";

    if (sources.length === 0) {
      sourcesEl.innerHTML = `<div class="empty-state">No sources retrieved.</div>`;
      return;
    }

    sources.forEach((source, i) => {
      const card = document.createElement("div");
      card.className = "source-card";

      const isImage = source.content_type === "image";

      const preview = isImage
        ? "Chart / figure"
        : (source.text || "").slice(0, 70) + ((source.text || "").length > 70 ? "…" : "");

      card.innerHTML = `
        <div class="source-header" onclick="toggleSource(this.parentElement)">
          <span class="type-dot ${isImage ? "image" : "text"}"></span>
          <span class="source-title">Source ${i + 1} — ${escapeHtml(preview)}</span>
          <span class="source-type-label">${isImage ? "image" : "text"}</span>
          <span class="chevron">▶</span>
        </div>
        <div class="source-body">
          ${isImage
            ? `<img src="${source.image_url}" alt="Retrieved chart" />`
            : `<div>${escapeHtml(source.text)}</div>`}
        </div>
      `;

      sourcesEl.appendChild(card);
    });
  }
</script>

</body>
</html>
